<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 268" role="img" aria-label="Measured jaw excursion falls from 105 percent at 1 hertz to 14 percent at 5 hertz, with syllables landing in the falling region and phonemes far beyond it."><rect width="780" height="268" fill="#14171C"/>
