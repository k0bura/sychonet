    <text x="62.0" y="48.3" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="10" fill="#E7E9ED" opacity=".6">100%</text>
    <polyline points="136.0,44.8 268.0,96.5 400.0,137.9 532.0,164.5 664.0,179.3" fill="none" stroke="#4FB6C1" stroke-width="2.2"/>
    <circle cx="136.0" cy="44.8" r="3.6" fill="#4FB6C1"/><text x="136.0" y="33.8" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#E7E9ED">105%</text><circle cx="268.0" cy="96.5" r="3.6" fill="#4FB6C1"/><text x="268.0" y="85.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#E7E9ED">70%</text><circle cx="400.0" cy="137.9" r="3.6" fill="#4FB6C1"/><text x="400.0" y="126.9" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#E7E9ED">42%</text><circle cx="532.0" cy="164.5" r="3.6" fill="#4FB6C1"/><text x="532.0" y="153.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#E7E9ED">24%</text><circle cx="664.0" cy="179.3" r="3.6" fill="#4FB6C1"/><text x="664.0" y="168.3" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#E7E9ED">14%</text><text x="136.0" y="219" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#E7E9ED" opacity=".55">1 Hz</text><text x="268.0" y="219" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#E7E9ED" opacity=".55">2 Hz</text><text x="400.0" y="219" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#E7E9ED" opacity=".55">3 Hz</text><text x="532.0" y="219" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#E7E9ED" opacity=".55">4 Hz</text><text x="664.0" y="219" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#E7E9ED" opacity=".55">5 Hz</text>
