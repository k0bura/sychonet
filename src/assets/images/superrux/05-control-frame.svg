<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 150" role="img" aria-label="One 17.2 millisecond cassette control frame: a sync burst, then seven narrow markers alternating with six variable-width data fields, then a 4.1 millisecond gap."><rect width="780" height="150" fill="#14171C"/>
  <g>
    <rect x="40.0" y="34" width="65.1" height="44" fill="#4FB6C1"/><text x="72.6" y="26" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#E7E9ED">sync</text><rect x="105.1" y="46" width="16.3" height="20" fill="#E7E9ED" fill-opacity=".55"/><rect x="121.4" y="40" width="42.7" height="32" fill="#E7A33C" fill-opacity=".85"/><rect x="164.1" y="46" width="16.3" height="20" fill="#E7E9ED" fill-opacity=".55"/><rect x="180.4" y="40" width="42.7" height="32" fill="#E7A33C" fill-opacity=".85"/><rect x="223.1" y="46" width="16.3" height="20" fill="#E7E9ED" fill-opacity=".55"/><rect x="239.4" y="40" width="42.7" height="32" fill="#E7A33C" fill-opacity=".85"/><rect x="282.2" y="46" width="16.3" height="20" fill="#E7E9ED" fill-opacity=".55"/><rect x="298.4" y="40" width="42.7" height="32" fill="#E7A33C" fill-opacity=".85"/><rect x="341.2" y="46" width="16.3" height="20" fill="#E7E9ED" fill-opacity=".55"/><rect x="357.4" y="40" width="42.7" height="32" fill="#E7A33C" fill-opacity=".85"/><rect x="400.2" y="46" width="16.3" height="20" fill="#E7E9ED" fill-opacity=".55"/><rect x="416.5" y="40" width="42.7" height="32" fill="#E7A33C" fill-opacity=".85"/><rect x="459.2" y="46" width="16.3" height="20" fill="#E7E9ED" fill-opacity=".55"/><rect x="475.5" y="54" width="167.7" height="4" fill="#E7E9ED" fill-opacity=".28"/><text x="559.3" y="26" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#E7E9ED">4.1 ms gap</text>
    <text x="181.4" y="98" font-family="IBM Plex Mono, monospace" font-size="10" fill="#E7A33C">six variable data fields, each between two fixed markers</text>
    <line x1="40" y1="112" x2="643.1" y2="112" stroke="#E7E9ED" stroke-opacity=".35"/>
    <line x1="40" y1="108" x2="40" y2="116" stroke="#E7E9ED" stroke-opacity=".35"/>
    <line x1="643.1" y1="108" x2="643.1" y2="116" stroke="#E7E9ED" stroke-opacity=".35"/>
    <text x="341.6" y="130" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#E7E9ED" opacity=".75">one frame &#8212; 17.2 ms, repeating at 58 Hz</text>
  </g>
</svg>